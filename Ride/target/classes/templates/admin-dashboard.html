<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<div class="container">
    <h1>Admin Dashboard</h1>

    <div class="card">
        <h2>Manage Users</h2>
        <p>View, approve, or block users.</p>
        <button>Manage Users</button>
    </div>

    <div class="card">
        <h2>Manage Drivers</h2>
        <p>Add, remove, or verify drivers.</p>
        <button>Manage Drivers</button>
    </div>

    <div class="card">
        <h2>Ride Overview</h2>
        <p>See all active and completed rides.</p>
        <button>View Rides</button>
    </div>

</div>

</body>
</html>
